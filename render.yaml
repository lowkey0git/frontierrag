services:
  - type: web
    name: frontier-rag
    runtime: docker
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
      - key: CHROMA_PATH
        value: /app/data/chroma
      - key: RAW_DATA_PATH
        value: /app/data/raw
